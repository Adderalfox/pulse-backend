version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC__PORT: "6334"
    healthcheck:
      test: ["CMD", "ls", "/qdrant"]
      interval: 10s
      timeout: 5s
      retries: 5

  play-backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:postgresql://host.docker.internal:5432/pulse"
      SLICK_URL: "jdbc:postgresql://host.docker.internal:5432/pulse"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
    ports:
      - "9000:9000"

volumes:
  postgres_data:
  qdrant_storage: